# WildAudioWorlds root Python environment.
# Node/Electron dependencies remain managed by the frontend package.json files.
# Deferred feature-specific extras for later validation: thebeat, praat-parselmouth,
# openai-whisper, whisperx, torchcrepe.

name: wild_audio_worlds
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pytest>=8
  - cython>=3.0
  - numpy>=1.26
  - pandas>=2.2
  - scipy>=1.12
  - matplotlib>=3.8
  - librosa=0.11
  - pysoundfile>=0.13
  - openpyxl>=3.1
  - scikit-learn
  - umap-learn
  - pyqt6>=6.11
  - pyqtgraph>=0.13
  - plotly>=6.0
  - statsmodels>=0.14
  - pip:
      - noisereduce>=3.0
      - sounddevice>=0.4